<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7f5">
  <title>Contabilă — gestiune financiară</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root {

    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; }

    .notification-icon.overdue { background: var(--red-soft); color: var(--red); }

    .notification-footer button:hover { background: var(--green-soft); }

    .notification-target { animation: notification-flash 2.4s ease-out; }

    .document-panel { overflow: hidden; }
    .table-tools { display: flex; gap: 8px; align-items: center; }
    .search-box { position: relative; }

    .search-box input { width: 185px; border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px 8px 30px; font-size: 10px; outline: none; }
    .search-box input:focus { border-color: #9cbea5; }
    .filter-select { border: 1px solid var(--line); background: white; border-radius: 7px; padding: 8px 9px; font-size: 10px; color: #677069; }
    .table-scroll-wrap { position: relative; }
    .table-scroll { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; scrollbar-color: #a9c5ae #f0f3ef; }
    .table-scroll::-webkit-scrollbar { height: 8px; }

    table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }

    .doc-cell { display: flex; align-items: center; gap: 9px; }

    .status { display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 20px; font-size: 9px; font-weight: 600; }
    .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .status.paid { background: var(--green-soft); color: var(--green); }
    .status.pending { background: var(--amber-soft); color: var(--amber); }

    .amount { font-weight: 700; color: #37413a; }

    const safe = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    function getNotifications() {
      const todayValue = isoDate(today);
      const todayDate = new Date(`${todayValue}T00:00:00`);
      const nextWeek = new Date(todayDate);
      nextWeek.setDate(nextWeek.getDate() + 7);
      const nextWeekValue = isoDate(nextWeek);
      const unpaidDocs = companyDocs().filter(doc => doc.status !== 'paid');
      const overdue = [];

      unpaidDocs.forEach(doc => {
        const daysUntilDue = Math.round((new Date(`${doc.due}T00:00:00`) - todayDate) / 86400000);
        if (doc.status === 'overdue' || daysUntilDue < 0) overdue.push({ doc, daysUntilDue });
        else if (doc.due <= nextWeekValue) dueSoon.push({ doc, daysUntilDue });
      });
      overdue.sort((a, b) => a.doc.due.localeCompare(b.doc.due));
      dueSoon.sort((a, b) => a.doc.due.localeCompare(b.doc.due));
      return { overdue, dueSoon };
    }
    function notificationItemMarkup(item, kind) {
      const { doc, daysUntilDue } = item;
      const overdue = kind === 'overdue';

        ? daysUntilDue < 0 ? `Restantă de ${Math.abs(daysUntilDue)} ${Math.abs(daysUntilDue) === 1 ? 'zi' : 'zile'} · scadentă ${dateRo(doc.due)}` : `Marcată ca restantă · scadență ${dateRo(doc.due)}`
        : daysUntilDue === 0 ? 'Scadentă astăzi'

      return `<button class="notification-item" type="button" data-notification-doc="${safe(doc.id)}"><span class="notification-icon ${overdue ? 'overdue' : 'due-soon'}">${overdue ? '!' : '◷'}</span><span class="notification-copy"><strong>${overdue ? 'Factură restantă' : 'Scadență apropiată'}<span>${dateRo(doc.date)}</span></strong><p>${safe(doc.number)} · ${safe(doc.party)}</p><small>${description} · ${money(doc.amount)}</small></span></button>`;

    function openRowActionMenu(trigger, id) {
      const doc = documents.find(item => item.id === id);
      if (!doc) { toast('Documentul nu mai este disponibil.'); return; }
      const menu = document.getElementById('rowActionMenu');
      if (menu.dataset.documentId === id && menu.classList.contains('open')) { closeRowActionMenu(); return; }
      closeRowActionMenu();
      menu.dataset.documentId = id;
      menu.dataset.triggerId = id;
      menu.innerHTML = `<button type="button" role="menuitem" data-row-action="toggle-status" data-document-id="${safe(id)}"><span class="menu-icon">${doc.status === 'paid' ? '↶' : '✓'}</span>${doc.status === 'paid' ? 'Marchează ca neachitată' : 'Marchează ca achitată'}</button><button type="button" role="menuitem" data-row-action="edit" data-document-id="${safe(id)}"><span class="menu-icon">✎</span>Editează documentul</button><button type="button" role="menuitem" data-row-action="open-pdf" data-document-id="${safe(id)}" ${doc.attachment ? '' : 'disabled'}><span class="menu-icon">↗</span>${doc.attachment ? 'Deschide PDF-ul atașat' : 'Nu există PDF atașat'}</button><div class="row-action-separator" role="separator"></div><button type="button" role="menuitem" class="danger" data-row-action="delete" data-document-id="${safe(id)}"><span class="menu-icon">×</span>Șterge documentul</button>`;
      trigger.setAttribute('aria-expanded', 'true');

        row.focus({ preventScroll: true });

    const MAX_PDF_SIZE = 20 * 1024 * 1024;
    let attachmentDbPromise;
    function openAttachmentDb() {
      if (!('indexedDB' in window)) return Promise.reject(new Error('Acest browser nu permite stocarea locală a fișierelor.'));
      if (!attachmentDbPromise) {
        attachmentDbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open('contabila_attachments', 1);
          request.onupgradeneeded = () => {
            if (!request.result.objectStoreNames.contains('attachments')) request.result.createObjectStore('attachments', { keyPath: 'id' });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => {
            attachmentDbPromise = null;
            reject(request.error || new Error('Nu s-a putut deschide arhiva locală de fișiere.'));
          };
          request.onblocked = () => {
            attachmentDbPromise = null;
            reject(new Error('Arhiva locală este ocupată de o altă filă. Închide filele duplicat și încearcă din nou.'));
          };
        });
      }
      return attachmentDbPromise;
    }
    async function storeAttachment(attachment) {
      const db = await openAttachmentDb();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction('attachments', 'readwrite');
        transaction.objectStore('attachments').put(attachment);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error || new Error('Nu s-a putut salva PDF-ul în arhiva locală.'));
        transaction.onabort = () => reject(transaction.error || new Error('Salvarea PDF-ului a fost anulată.'));
      });
    }
    async function getAttachment(id) {
      const db = await openAttachmentDb();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction('attachments', 'readonly');
        const request = transaction.objectStore('attachments').get(id);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error || new Error('Nu s-a putut citi PDF-ul din arhiva locală.'));
      });
    }
    async function removeAttachment(id) {
      const db = await openAttachmentDb();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction('attachments', 'readwrite');
        transaction.objectStore('attachments').delete(id);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error || new Error('Nu s-a putut șterge PDF-ul temporar.'));
      });
    }

    function wireTableScroll(container = document) {

          const maxScroll = Math.max(0, scroller.scrollWidth - scroller.clientWidth);
          wrap.classList.toggle('is-scrolled', scroller.scrollLeft > 1);
          wrap.classList.toggle('is-at-end', scroller.scrollLeft >= maxScroll - 1);
          wrap.querySelectorAll('[data-table-scroll]').forEach(button => {
            button.disabled = Number(button.dataset.tableScroll) < 0
              ? scroller.scrollLeft <= 1
              : scroller.scrollLeft >= maxScroll - 1;

        scroller.addEventListener('scroll', update, { passive: true });
        scroller.addEventListener('keydown', event => {
          if (event.target !== scroller || !['ArrowLeft', 'ArrowRight'].includes(event.key)) return;

        });
        wrap.querySelectorAll('[data-table-scroll]').forEach(button => button.addEventListener('click', () => {

        update();

          const amount = Number(document.getElementById('docAmount').value);
          if (!Number.isFinite(amount) || amount <= 0) { toast('Introdu o valoare mai mare decât zero.'); return; }
          const date = document.getElementById('docDate').value, due = document.getElementById('docDue').value;
          if (due < date) { toast('Scadența nu poate fi înaintea datei documentului.'); return; }
          const file = pdfInput.files[0] || null;
          if (file && file.size > MAX_PDF_SIZE) { toast('PDF-ul depășește limita de 20 MB.'); return; }
          if (file && (!file.name.toLowerCase().endsWith('.pdf') || (await file.slice(0, 5).text()) !== '%PDF-')) { toast('Fișierul selectat nu este un PDF valid.'); return; }
          const id = `d${Date.now()}`;
          const attachment = file ? { name: file.name, size: file.size, type: 'application/pdf' } : undefined;
          const newDocument = { id, company: activeCompany, number: document.getElementById('docNumber').value.trim(), type: document.getElementById('docType').value, party: document.getElementById('docParty').value.trim(), date, due, amount, status: document.getElementById('docStatus').value, direction, attachment };
          const submitButton = event.submitter;
          submitButton.disabled = true;
          submitButton.textContent = 'Se salvează…';
          let attachmentSaved = false;
          try {
            if (file) {
              await storeAttachment({ id, name: file.name, size: file.size, type: 'application/pdf', blob: file });
              attachmentSaved = true;
            }
            documents.unshift(newDocument);
            try {
              saveData();
            } catch (error) {
              documents = documents.filter(document => document.id !== id);
              if (attachmentSaved) await removeAttachment(id);
              throw error;
            }
            closeModal(); render(); toast(file ? 'Documentul și PDF-ul au fost salvate în acest browser.' : 'Documentul a fost înregistrat.');
          } catch (error) {
            console.error('Eroare la salvarea documentului sau a atașamentului PDF.', error);
            toast(`Nu s-a putut salva documentul: ${error.message || 'eroare necunoscută.'}`);
            submitButton.disabled = false;
            submitButton.textContent = 'Salvează documentul';
          }
        });
        document.getElementById('docNumber').focus();
      });
    }
    async function openAttachment(id) {
      const doc = documents.find(document => document.id === id);
      if (!doc?.attachment) { toast('Nu există un PDF atașat acestui document.'); return; }
      const previewWindow = window.open('', '_blank');
      try {
        const attachment = await getAttachment(id);
        if (!attachment?.blob) throw new Error('PDF-ul nu mai este disponibil în acest browser.');
        const url = URL.createObjectURL(attachment.blob);
        if (previewWindow) {
          previewWindow.location.replace(url);
        } else {
          const link = document.createElement('a');
          link.href = url;
          link.download = attachment.name;
          document.body.appendChild(link);
          link.click();
          link.remove();
        }
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (error) {
        if (previewWindow) previewWindow.close();
        console.error('Eroare la deschiderea atașamentului PDF.', error);
        toast(`PDF-ul nu a putut fi deschis: ${error.message || 'eroare necunoscută.'}`);
      }
    }
    function openCompanyModal() {
      openModal(`<div class="modal-heading"><div><h2 id="modalTitle">Adaugă o companie</h2><p>Începe evidența primară pentru o afacere nouă.</p></div><button class="close-btn" type="button" aria-label="Închide" data-close>×</button></div><form id="companyForm"><div class="form-grid"><div class="field full"><label for="companyName">Denumire companie</label><input id="companyName" required placeholder="ex. Firma Mea SRL"></div><div class="field full"><label for="companyCui">CUI / CIF</label><input id="companyCui" required placeholder="ex. RO12345678"></div></div><div class="modal-actions"><button class="secondary-btn" type="button" data-close>Anulează</button><button class="primary-btn" type="submit">Adaugă compania</button></div></form>`, () => {
        document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', closeModal));
        document.getElementById('companyForm').addEventListener('submit', event => {
          event.preventDefault();
          const name = document.getElementById('companyName').value.trim(), cui = document.getElementById('companyCui').value.trim();
          if (companies.some(company => company.cui.toLowerCase() === cui.toLowerCase())) { toast('Există deja o companie cu acest CUI.'); return; }
          companies.push({ id: `c${Date.now()}`, name, cui }); activeCompany = companies[companies.length - 1].id;
          saveData(); closeModal(); render(); toast('Compania a fost adăugată.');
        });
        document.getElementById('companyName').focus();
      });
    }
    function togglePaid(id) {
      const doc = documents.find(item => item.id === id); if (!doc) return;
      doc.status = doc.status === 'paid' ? 'pending' : 'paid';
      saveData(); render(); toast(doc.status === 'paid' ? 'Document marcat ca achitat.' : 'Document marcat ca neachitat.');
    }
    function openEditDocModal(id) {
      const doc = documents.find(item => item.id === id);
      if (!doc) { toast('Documentul nu mai este disponibil.'); return; }
      const types = doc.direction === 'in'
        ? ['Factură emisă', 'Chitanță', 'Bon fiscal']
        : ['Factură furnizor', 'Chitanță', 'Bon fiscal', 'Ordin de plată'];
      const options = [...new Set([...types, doc.type])];
      openModal(`<div class="modal-heading"><div><h2 id="modalTitle">Editează documentul</h2><p>Actualizează detaliile documentului.</p></div><button class="close-btn" type="button" aria-label="Închide" data-close>×</button></div><form id="editDocForm"><div class="form-grid"><div class="field"><label for="editDocType">Tip document</label><select id="editDocType">${options.map(type => `<option ${type === doc.type ? 'selected' : ''}>${safe(type)}</option>`).join('')}</select></div><div class="field"><label for="editDocNumber">Număr document</label><input id="editDocNumber" required value="${safe(doc.number)}"></div><div class="field full"><label for="editDocParty">Client / furnizor</label><input id="editDocParty" required value="${safe(doc.party)}"></div><div class="field"><label for="editDocDate">Data documentului</label><input id="editDocDate" type="date" required value="${safe(doc.date)}"></div><div class="field"><label for="editDocDue">Data scadenței</label><input id="editDocDue" type="date" required value="${safe(doc.due)}"></div><div class="field"><label for="editDocAmount">Valoare (lei)</label><input id="editDocAmount" type="number" min="0.01" step="0.01" required value="${safe(doc.amount)}"></div><div class="field"><label for="editDocStatus">Stare plată</label><select id="editDocStatus"><option value="pending" ${doc.status === 'pending' ? 'selected' : ''}>În așteptare</option><option value="paid" ${doc.status === 'paid' ? 'selected' : ''}>Achitată</option><option value="overdue" ${doc.status === 'overdue' ? 'selected' : ''}>Restantă</option></select></div><div class="field full"><span class="field-hint">${doc.attachment ? `PDF atașat: ${safe(doc.attachment.name)}. Atașamentul existent va fi păstrat.` : 'Nu există un PDF atașat acestui document.'}</span></div></div><div class="modal-actions"><button class="secondary-btn" type="button" data-close>Anulează</button><button class="primary-btn" type="submit">Salvează modificările</button></div></form>`, () => {
        document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', closeModal));
        document.getElementById('editDocForm').addEventListener('submit', event => {
          event.preventDefault();
          const amount = Number(document.getElementById('editDocAmount').value);
          const date = document.getElementById('editDocDate').value;
          const due = document.getElementById('editDocDue').value;
          if (!Number.isFinite(amount) || amount <= 0) { toast('Introdu o valoare mai mare decât zero.'); return; }
          if (due < date) { toast('Scadența nu poate fi înaintea datei documentului.'); return; }
          const previous = { ...doc };
          Object.assign(doc, {
            type: document.getElementById('editDocType').value,
            number: document.getElementById('editDocNumber').value.trim(),
            party: document.getElementById('editDocParty').value.trim(),
            date, due, amount,
            status: document.getElementById('editDocStatus').value
          });
          try {
            saveData();
          } catch (error) {
            Object.assign(doc, previous);
            console.error('Eroare la salvarea modificărilor documentului.', error);
            toast('Modificările nu au putut fi salvate în browser.');
            return;
          }
          closeModal(); render(); toast('Modificările documentului au fost salvate.');
        });
        document.getElementById('editDocNumber').focus();
      });
    }
    function confirmDeleteDoc(id) {
      const doc = documents.find(item => item.id === id);
      if (!doc) { toast('Documentul nu mai este disponibil.'); return; }
      openModal(`<div class="modal-heading"><div><h2 id="modalTitle">Ștergi documentul?</h2><p>Documentul ${safe(doc.number)} va fi eliminat definitiv din registru.</p></div><button class="close-btn" type="button" aria-label="Închide" data-close>×</button></div><p style="font-size:11px;color:#626c65;line-height:1.6">Ești pe cale să ștergi documentul de la <strong>${safe(doc.party)}</strong>, în valoare de <strong>${money(doc.amount)}</strong>${doc.attachment ? ', împreună cu PDF-ul atașat' : ''}. Această acțiune nu poate fi anulată.</p><div class="modal-actions"><button class="secondary-btn" type="button" data-close>Anulează</button><button class="primary-btn" type="button" id="confirmDeleteDoc" style="background:var(--red)">Șterge documentul</button></div>`, () => {
        document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', closeModal));
        document.getElementById('confirmDeleteDoc').addEventListener('click', async event => {
          const button = event.currentTarget;
          button.disabled = true;
          button.textContent = 'Se șterge…';
          const index = documents.findIndex(item => item.id === id);
          if (index < 0) { closeModal(); toast('Documentul nu mai este disponibil.'); return; }
          const [removed] = documents.splice(index, 1);
          try {
            saveData();
          } catch (error) {
            documents.splice(index, 0, removed);
            console.error('Eroare la ștergerea documentului.', error);
            toast('Documentul nu a putut fi șters din registru.');
            closeModal();
            return;
          }
          closeModal(); render();
          if (removed.attachment) {
            try {
              await removeAttachment(id);
              toast('Documentul și PDF-ul atașat au fost șterse.');
            } catch (error) {
              console.error('Documentul a fost șters, dar PDF-ul local nu a putut fi șters.', error);
              toast('Documentul a fost șters; PDF-ul rămas în arhiva locală nu a putut fi eliminat.');
            }
          } else {
            toast('Documentul a fost șters.');
          }
        });
      });
    }
    function exportCsv() {
      const docs = companyDocs();
      const rows = [['Număr document', 'Tip document', 'Partener', 'Data', 'Scadență', 'Valoare (RON)', 'Stare', 'Direcție'], ...docs.map(d => [d.number, d.type, d.party, d.date, d.due, d.amount.toFixed(2), statusLabel(d.status), d.direction === 'in' ? 'Încasare' : 'Plată'])];
      const csv = '\uFEFF' + rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(';')).join('\r\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      const link = document.createElement('a'); link.href = url; link.download = `documente-${(companies.find(c => c.id === activeCompany)?.name || 'companie').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.csv`;
      document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url); toast('Raportul CSV a fost descărcat.');
    }
    document.querySelectorAll('.nav-btn[data-page]').forEach(button => button.addEventListener('click', () => goPage(button.dataset.page)));
    document.addEventListener('click', event => {
      const trigger = event.target.closest('[data-row-menu]');
      if (trigger) { openRowActionMenu(trigger, trigger.dataset.rowMenu); return; }
      const action = event.target.closest('[data-row-action]');
      if (action) {
        const { documentId } = action.dataset;
        const actionType = action.dataset.rowAction;
        closeRowActionMenu();
        if (actionType === 'toggle-status') togglePaid(documentId);
        else if (actionType === 'edit') openEditDocModal(documentId);
        else if (actionType === 'open-pdf') openAttachment(documentId);
        else if (actionType === 'delete') confirmDeleteDoc(documentId);
        return;
      }
      if (!event.target.closest('#rowActionMenu')) closeRowActionMenu();
    });
    document.addEventListener('keydown', event => {
      const menu = document.getElementById('rowActionMenu');
      if (!menu.classList.contains('open')) return;
      if (event.key === 'Escape') { event.preventDefault(); closeRowActionMenu(true); return; }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        const items = [...menu.querySelectorAll('[role="menuitem"]:not(:disabled)')];
        const current = items.indexOf(document.activeElement);
        const direction = event.key === 'ArrowDown' ? 1 : -1;
        items[(current + direction + items.length) % items.length]?.focus();
        event.preventDefault();
      }
    });
    window.addEventListener('resize', () => closeRowActionMenu());
    window.addEventListener('scroll', () => closeRowActionMenu(), true);
    document.getElementById('companySelect').addEventListener('change', event => { activeCompany = event.target.value; saveData(); render(); toast('A fost schimbată compania activă.'); });
    document.getElementById('notificationBtn').addEventListener('click', () => {
      const popover = document.getElementById('notificationPopover');
      if (popover.classList.contains('open')) closeNotificationPopover();
      else openNotificationPopover();
    });
    document.getElementById('notificationPopover').addEventListener('click', event => {
      if (event.target.closest('.notification-close')) { closeNotificationPopover(); document.getElementById('notificationBtn').focus(); return; }
      const notification = event.target.closest('[data-notification-doc]');
      if (notification) { goToNotificationDocument(notification.dataset.notificationDoc); return; }
      if (event.target.closest('[data-notification-page]')) { closeNotificationPopover(); goPage('documents'); }
    });
    document.addEventListener('click', event => {
      if (!event.target.closest('#notificationWrap')) closeNotificationPopover();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && document.getElementById('notificationPopover').classList.contains('open')) {
        closeNotificationPopover();
        document.getElementById('notificationBtn').focus();
      }
    });
    document.getElementById('helpBtn').addEventListener('click', () => toast('Centrul de ajutor va fi disponibil în curând.'));
    render();
  </script>
</body>
</html>
